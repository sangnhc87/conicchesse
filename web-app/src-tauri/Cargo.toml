[package]
name = "ky-dai-conic"
version = "1.0.0"
description = "Kỳ Đài Conic — Học cờ tướng với Pikafish Native"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
