<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)" />
  <rect x="40" y="40" width="944" height="944" rx="190" fill="none" stroke="#fbbf24" stroke-width="24" stroke-opacity="0.8" />
  <text x="512" y="750" font-family="'Noto Serif TC', serif, sans-serif" font-size="640" font-weight="900" fill="#fef3c7" text-anchor="middle" filter="url(#glow)">帥</text>
</svg>
